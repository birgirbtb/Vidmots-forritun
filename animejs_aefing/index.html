<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anime</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pos">
        <div class="square disabled draggable"></div>
    </div>
    <div class="pos">
        <div class="label">swipe</div>
    </div>
    <script type="module">
        import { createDraggable } from 'https://cdn.jsdelivr.net/npm/animejs/+esm';

        const SWIPE_THRESHOLD = 50;
        const MAX_SWIPE_TIME = 300;

        let startX = 0;
        let startY = 0;
        let startTime = 0;

        const square = document.querySelector('.square.disabled');
        const container = square.parentElement;

        createDraggable('.square.disabled', {
            container,
            x: {
                snap: value => {
                    const rightPosition = container.clientWidth - square.offsetWidth;
                    return value < rightPosition / 2 ? 0 : rightPosition;
                }
            },
            y: false
        });

        

    </script>
</body>
</html>
